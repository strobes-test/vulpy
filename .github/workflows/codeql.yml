name: "CodeQL"

on:
  push:
    branches: [ "add-license-1", "add-license-2" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "add-license-1" ]
  schedule:
    - cron: '44 2 * * 4'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'python' ]
        # Supported: cpp, csharp, go, java, javascript, python, ruby

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      # For compiled languages, this attempts to automatically build your code.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      # Perform the actual CodeQL analysis.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
